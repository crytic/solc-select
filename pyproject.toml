[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solc-select"
version = "1.1.0"
dependencies = [
  "pycryptodome>=3.4.6",
  "packaging",
]
requires-python = ">= 3.8"
authors = [
  {name = "Trail of Bits", email = "opensource@trailofbits.com"},
]
maintainers = [
  {name = "Trail of Bits", email = "opensource@trailofbits.com"},
]
description = "Manage multiple Solidity compiler versions."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["solc", "solidity", "ethereum", "compiler", "version manager"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Compilers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/crytic/solc-select"
Repository = "https://github.com/crytic/solc-select.git"
Issues = "https://github.com/crytic/solc-select/issues"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    # Linting and type checking
    "ruff>=0.1.0",
    "pylint>=2.15.0",
    "mypy>=1.0.0",
    "types-setuptools",
]

[project.scripts]
solc-select = "solc_select.__main__:solc_select"
solc = "solc_select.__main__:solc"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ files

[tool.ruff.format]
# Match black's formatting style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pylint.messages_control]
disable = """
missing-module-docstring,
missing-class-docstring,
missing-function-docstring,
unnecessary-lambda,
cyclic-import,
line-too-long,
invalid-name,
fixme,
too-many-return-statements,
too-many-ancestors,
logging-fstring-interpolation,
logging-not-lazy,
duplicate-code,
import-error,
unsubscriptable-object
"""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "linux: marks tests to run only on Linux",
    "macos: marks tests to run only on macOS", 
    "windows: marks tests to run only on Windows",
]
